<!--Sample page-->

<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <title>Lietuviškas Žodis</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 400px;
      margin: 40px auto;
      text-align: center;
      background-color: #f4f4f4;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 50px);
      gap: 6px;
      justify-content: center;
      margin: 20px 0;
    }
    .cell {
      width: 50px;
      height: 50px;
      border: 2px solid #999;
      background: #fff;
      font-size: 24px;
      font-weight: bold;
      line-height: 50px;
    }
    .green { background: #6aaa64; color: #fff; border-color: #6aaa64; }
    .yellow { background: #c9b458; color: #fff; border-color: #c9b458; }
    .gray { background: #787c7e; color: #fff; border-color: #787c7e; }
  </style>
</head>
<body>

  <h1>Lietuviškas Žodinėlis</h1>
  <p>Atspėk 5 raidžių žodį</p>

  <div class="grid">
    <div class="cell green">N</div>
    <div class="cell gray">A</div>
    <div class="cell yellow">M</div>
    <div class="cell gray">A</div>
    <div class="cell gray">S</div>

    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>

    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
  </div>

  <p>Pavyzdiniai žodžiai: namas, kalba, siela</p>

</body>
</html>
